<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" width="630" height="500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d9a441" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#d9a441" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a83a2a"/>
      <stop offset="100%" stop-color="#c94f3d"/>
    </linearGradient>
  </defs>

  <rect width="630" height="500" fill="#100e0c"/>
  <rect width="630" height="500" fill="url(#glow)"/>
  <rect x="10" y="10" width="610" height="480" rx="6" fill="none" stroke="#d9a441" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- title -->
  <text x="315" y="120" text-anchor="middle" fill="#d9a441" font-size="66" letter-spacing="8" style="text-shadow:0 0 30px rgba(217,164,65,.4)">MASTERS</text>
  <text x="315" y="172" text-anchor="middle" fill="#d9a441" font-size="42" letter-spacing="10">OF THE WAY</text>
  <text x="315" y="206" text-anchor="middle" fill="#9a8f7c" font-size="18" font-style="italic">a martial arts card battler</text>

  <!-- boxer portrait (left) -->
  <g transform="translate(135,262) scale(1.4)">
    <circle cx="50" cy="50" r="47" fill="#c94f3d" opacity=".1"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="#c94f3d" stroke-width="2" opacity=".55"/>
    <path d="M50 60 Q28 65 24 90 L76 90 Q72 65 50 60 Z" fill="#0d0b08"/>
    <circle cx="50" cy="40" r="16" fill="#0d0b08"/>
    <circle cx="26" cy="60" r="10" fill="#c94f3d"/><rect x="21" y="68" width="10" height="8" rx="3" fill="#8a3527"/>
    <circle cx="74" cy="60" r="10" fill="#c94f3d"/><rect x="69" y="68" width="10" height="8" rx="3" fill="#8a3527"/>
  </g>

  <!-- bjj portrait (right) -->
  <g transform="translate(355,262) scale(1.4)">
    <circle cx="50" cy="50" r="47" fill="#8a63c9" opacity=".1"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="#8a63c9" stroke-width="2" opacity=".55"/>
    <path d="M50 60 Q28 65 24 90 L76 90 Q72 65 50 60 Z" fill="#0d0b08"/>
    <circle cx="50" cy="40" r="16" fill="#0d0b08"/>
    <path d="M36 64 L50 84 L64 64" fill="none" stroke="#8a63c9" stroke-width="5"/>
    <path d="M62 34 Q70 48 66 62" fill="none" stroke="#0d0b08" stroke-width="7"/>
    <path d="M28 84 L72 84" stroke="#8a63c9" stroke-width="4"/>
  </g>

  <text x="315" y="352" text-anchor="middle" fill="#d9a441" font-size="30" letter-spacing="3" font-style="italic">vs</text>

  <!-- tagline -->
  <text x="315" y="418" text-anchor="middle" fill="#e8e0d0" font-size="16" font-style="italic">master one way, or take what works from everywhere</text>

  <!-- six arts strip -->
  <g font-size="11" text-anchor="middle">
    <circle cx="70"  cy="452" r="7" fill="#c94f3d"/><text x="70"  y="477" fill="#9a8f7c">Boxing</text>
    <circle cx="182" cy="452" r="7" fill="#cfc9b8"/><text x="182" y="477" fill="#9a8f7c">Karate</text>
    <circle cx="294" cy="452" r="7" fill="#4aa58a"/><text x="294" y="477" fill="#9a8f7c">Taekwondo</text>
    <circle cx="406" cy="452" r="7" fill="#d9a441"/><text x="406" y="477" fill="#9a8f7c">Muay Thai</text>
    <circle cx="518" cy="452" r="7" fill="#4a7ab5"/><text x="518" y="477" fill="#9a8f7c">Judo</text>
    <circle cx="588" cy="452" r="7" fill="#8a63c9"/><text x="588" y="477" fill="#9a8f7c">BJJ</text>
  </g>
</svg>
