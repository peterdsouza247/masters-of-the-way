/* ================================================================ profiles (portable save file) */

const PROFILE_NAME_KEY = "motw-profile-v1";
const STATS_KEY = "motw-stats-v1";
const PROFILE_MAP = { settings: SET_KEY, decks: DECKS_KEY, fights: FIGHTS_KEY, runs: RUNS_KEY, onboard: ONBOARD_KEY, stats: STATS_KEY };
const escapeAttr = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function getProfileName() {
  try { const p = JSON.parse(localStorage.getItem(PROFILE_NAME_KEY)); if (p && p.name) return p.name; } catch (e) {}
  return "Player";
}
function setProfileName(name) {
  try { localStorage.setItem(PROFILE_NAME_KEY, JSON.stringify({ name: String(name).slice(0, 24) })); } catch (e) {}
}
function readKey(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeKey(k, v) { try { if (v == null) return; localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function buildProfile() {
  const data = {};
  for (const [k, key] of Object.entries(PROFILE_MAP)) data[k] = readKey(key);
  return { app: "masters-of-the-way", type: "profile", version: 1, exportedAt: new Date().toISOString(), name: getProfileName(), data };
}

const b64enc = (s) => btoa(unescape(encodeURIComponent(s)));
const b64dec = (b) => decodeURIComponent(escape(atob(b)));

function downloadProfile() {
  const obj = buildProfile();
  const json = JSON.stringify(obj, null, 2);
  const safe = (obj.name || "player").replace(/[^a-z0-9\-_]+/gi, "_").toLowerCase() || "player";
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `motw-profile-${safe}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function parseProfile(text) {
  let obj;
  try { obj = JSON.parse(text); }
  catch (e) { try { obj = JSON.parse(b64dec(text.trim())); } catch (e2) { return null; } }
  if (!obj || typeof obj !== "object") return null;
  if (obj.app && obj.app !== "masters-of-the-way") return null;
  if (!obj.data || typeof obj.data !== "object") return null;
  return obj;
}

function applyProfile(obj, mode) {
  const d = obj.data || {};
  if (mode === "replace") {
    for (const [k, key] of Object.entries(PROFILE_MAP)) if (k in d) writeKey(key, d[k]);
    if (obj.name) setProfileName(obj.name);
    applySettings();
    return;
  }
  // merge: bring decks/record/runs, keep this device's preferences
  if (Array.isArray(d.decks)) {
    const byName = {};
    for (const dk of (readKey(DECKS_KEY) || [])) if (dk && dk.name) byName[dk.name.toLowerCase()] = dk;
    for (const dk of d.decks) if (dk && dk.name) byName[dk.name.toLowerCase()] = dk;   // incoming wins ties
    writeKey(DECKS_KEY, Object.values(byName));
  }
  if (Array.isArray(d.fights)) {
    const all = (readKey(FIGHTS_KEY) || []).concat(d.fights);
    const seen = new Set(), out = [];
    for (const f of all) {
      const sig = [f.date, f.title, f.method, f.turns, f.winner].join("|");
      if (seen.has(sig)) continue;
      seen.add(sig); out.push(f);
    }
    out.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    writeKey(FIGHTS_KEY, out.slice(0, 25));
  }
  if (d.runs && typeof d.runs === "object") {
    const ex = readKey(RUNS_KEY) || { best: 0, completions: 0, runs: [] };
    writeKey(RUNS_KEY, {
      best: Math.max(ex.best || 0, d.runs.best || 0),
      completions: Math.max(ex.completions || 0, d.runs.completions || 0),
      runs: (Array.isArray(ex.runs) ? ex.runs : []).concat(Array.isArray(d.runs.runs) ? d.runs.runs : []).slice(0, 20),
    });
  }
  if (d.stats && typeof d.stats === "object") {
    const ex = Object.assign(emptyStats(), readKey(STATS_KEY) || {});
    writeKey(STATS_KEY, {
      w: Math.max(ex.w, d.stats.w || 0), l: Math.max(ex.l, d.stats.l || 0),
      ko: Math.max(ex.ko, d.stats.ko || 0), sub: Math.max(ex.sub, d.stats.sub || 0),
    });
  }
  if (d.onboard && (d.onboard.tutorialDone || loadOnboard().tutorialDone)) markTutorialDone();
}

function emptyStats() { return { w: 0, l: 0, ko: 0, sub: 0 }; }
function bumpStats(s, won, method) {
  if (won) { s.w++; if (method === "Tap Out") s.sub++; else s.ko++; }
  else s.l++;
  return s;
}
function bumpDeviceStats(won, method) {
  const s = Object.assign(emptyStats(), readKey(STATS_KEY) || {});
  bumpStats(s, won, method);
  writeKey(STATS_KEY, s);
}
function careerStats() {
  const runs = loadRuns();
  const s = readKey(STATS_KEY);
  if (s && typeof s === "object") {
    const w = s.w || 0, l = s.l || 0;
    return { w, l, ko: s.ko || 0, sub: s.sub || 0, total: w + l, best: runs.best || 0, cleared: runs.completions || 0 };
  }
  // legacy fallback: derive from the fight record
  const fights = loadFights();
  let w = 0, l = 0, ko = 0, sub = 0;
  for (const f of fights) {
    if (f.hotseat) continue;
    if (f.playerWon) { w++; if (f.method === "Tap Out") sub++; else ko++; }
    else l++;
  }
  return { w, l, ko, sub, total: w + l, best: runs.best || 0, cleared: runs.completions || 0 };
}

function showProfile() {
  clearCoach();
  $("duel").style.display = "none";
  app.style.display = "block";
  app.innerHTML = "";
  const st = careerStats();
  const s = el(`<div class="screen">
    <h2>Profile</h2>
    <div class="sub">Your decks, fight record, and stats live in this browser. Save them to a file (or a code) to carry across devices and browsers, to survive a cleared cache, or to bring your decks to a friend's screen for pass-and-play.</div>
    <div style="text-align:center;margin-bottom:6px">
      <input id="prof-name" maxlength="24" value="${escapeAttr(getProfileName())}"
        style="width:100%;max-width:300px;padding:11px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--ink);font:inherit;text-align:center" aria-label="Fighter name">
      <div class="locknote">your fighter name, saved automatically</div>
    </div>
    <div class="simcard" style="text-align:center">
      <b>Career</b><br>
      Record vs AI <b>${st.w}-${st.l}</b>${st.total ? " (" + Math.round(st.w / Math.max(1, st.total) * 100) + "%)" : ""} ·
      Finishes <b>${st.ko}</b> KO / <b>${st.sub}</b> submission<br>
      Gauntlet best <b>${st.best}/7</b>${st.cleared ? " · cleared " + st.cleared + "×" : ""}
    </div>
    <div class="art-head" style="color:var(--gold);max-width:520px;margin:18px auto 8px">Save (export)</div>
    <div style="text-align:center">
      <button class="cnt-btn" style="width:auto;padding:6px 18px" id="prof-download">Download .json</button>
      <button class="cnt-btn" style="width:auto;padding:6px 18px" id="prof-copy">Copy code</button>
    </div>
    <div class="art-head" style="color:var(--gold);max-width:520px;margin:18px auto 8px">Load (import)</div>
    <div style="text-align:center;margin-bottom:8px;font-size:14px">
      <label><input type="radio" name="prof-mode" value="merge" checked> Merge into this device</label>
      &nbsp;&nbsp; <label><input type="radio" name="prof-mode" value="replace"> Replace everything</label>
    </div>
    <div style="text-align:center">
      <button class="cnt-btn" style="width:auto;padding:6px 18px" id="prof-file">Load from file...</button>
      <input type="file" id="prof-fileinput" accept="application/json,.json" style="display:none">
    </div>
    <div style="text-align:center;margin-top:10px">
      <textarea id="prof-code" placeholder="...or paste a profile code here" rows="3"
        style="width:100%;max-width:340px;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--ink);font:inherit"></textarea><br>
      <button class="cnt-btn" style="width:auto;padding:6px 18px;margin-top:6px" id="prof-loadcode">Load code</button>
    </div>
    <div id="prof-msg" style="text-align:center;color:var(--gold);min-height:22px;margin-top:12px"></div>
    <div style="text-align:center"><button class="back" id="prof-back">back</button></div>
  </div>`);
  app.appendChild(s);
  const msg = (t, bad) => { const m = $("prof-msg"); m.textContent = t; m.style.color = bad ? "var(--red)" : "var(--gold)"; announce(t); };
  const mode = () => (document.querySelector('input[name="prof-mode"]:checked') || {}).value || "merge";
  $("prof-name").oninput = () => { setProfileName($("prof-name").value.trim() || "Player"); };
  $("prof-download").onclick = () => { Sound.ui(); downloadProfile(); msg("Profile downloaded. Keep the .json safe."); };
  $("prof-copy").onclick = async () => {
    Sound.ui();
    const code = b64enc(JSON.stringify(buildProfile()));
    try { await navigator.clipboard.writeText(code); msg("Code copied to clipboard."); }
    catch (e) { $("prof-code").value = code; msg("Clipboard blocked. The code is in the box below; copy it manually."); }
  };
  const doImport = (text) => {
    const obj = parseProfile(text);
    if (!obj) { msg("That doesn't look like a Masters of the Way profile.", true); return; }
    const m = mode();
    if (m === "replace" && !confirm("Replace ALL decks, records, and settings on this device with the imported profile? This can't be undone.")) return;
    applyProfile(obj, m);
    Sound.win();
    msg(`Loaded ${obj.name ? '"' + obj.name + '"' : "profile"} (${m === "replace" ? "replaced" : "merged"}).`);
    setTimeout(showProfile, 900);
  };
  $("prof-file").onclick = () => $("prof-fileinput").click();
  $("prof-fileinput").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => doImport(String(r.result || ""));
    r.onerror = () => msg("Couldn't read that file.", true);
    r.readAsText(file);
  };
  $("prof-loadcode").onclick = () => { const t = $("prof-code").value.trim(); if (!t) { msg("Paste a code first.", true); return; } doImport(t); };
  $("prof-back").onclick = showMenu;
}

/* ================================================================ boot */

(function installPWA() {
  const icon = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>` +
    `<rect width='100' height='100' rx='16' fill='#100e0c'/>` +
    `<circle cx='50' cy='50' r='34' fill='none' stroke='#d9a441' stroke-width='4'/>` +
    `<path d='M50 26 V74 M32 44 H68' stroke='#d9a441' stroke-width='4' fill='none' stroke-linecap='round'/></svg>`);
  const fav = document.createElement("link"); fav.rel = "icon"; fav.href = icon; document.head.appendChild(fav);
  const apple = document.createElement("link"); apple.rel = "apple-touch-icon"; apple.href = icon; document.head.appendChild(apple);
  try {
    const manifest = {
      name: "Masters of the Way", short_name: "Masters",
      description: "A martial-arts card battler built from six real arts.",
      display: "standalone", orientation: "portrait",
      background_color: "#100e0c", theme_color: "#100e0c", start_url: ".",
      icons: [{ src: icon, sizes: "any", type: "image/svg+xml", purpose: "any" }],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const m = document.createElement("link"); m.rel = "manifest"; m.href = URL.createObjectURL(blob);
    document.head.appendChild(m);
  } catch (e) {}
})();

applySettings();
try { Pad.start(); } catch (e) {}
if (/[?&]sim=1(&|$)/.test(location.search)) showSimPanel();
else showMenu();
</script>
