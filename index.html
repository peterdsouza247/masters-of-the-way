<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masters of the Way</title>
<meta name="description" content="Masters of the Way: a martial-arts card battler built from six real arts, each with a genuine mechanical identity. Master one way, or take what works from everywhere.">
<meta name="theme-color" content="#100e0c">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Masters of the Way">
<meta property="og:description" content="One-on-one martial arts duels. Six real arts, each with a genuine mechanical identity. Master one way, or take what works from everywhere.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Masters of the Way">
<style>
  :root {
    --bg: #100e0c;
    --panel: #1a1714;
    --panel2: #221e19;
    --ink: #e8e0d0;
    --dim: #9a8f7c;
    --red: #c94f3d;
    --gold: #d9a441;
    --border: #383029;
    --boxing: #c94f3d;
    --karate: #cfc9b8;
    --judo: #4a7ab5;
    --bjj: #8a63c9;
    --muaythai: #d9a441;
    --taekwondo: #4aa58a;
    --neutral: #9a8f7c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px; line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  .screen { max-width: 860px; margin: 0 auto; padding: 16px 14px 60px; }
  h1 {
    font-variant: small-caps; letter-spacing: 6px; text-align: center;
    color: var(--gold); font-weight: normal; font-size: 32px; margin: 40px 0 4px;
    text-shadow: 0 0 34px rgba(217, 164, 65, .3);
  }
  .sub { text-align: center; color: var(--dim); font-style: italic; margin-bottom: 30px; }
  h2 {
    font-variant: small-caps; letter-spacing: 3px; color: var(--gold);
    font-weight: normal; font-size: 20px; margin: 26px 0 10px; text-align: center;
  }
  .menu-btn {
    display: block; width: 100%; max-width: 420px; margin: 10px auto;
    padding: 14px 18px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; text-align: left;
    transition: border-color .15s, transform .15s;
  }
  .menu-btn:hover { border-color: var(--gold); transform: translateX(2px); }
  .menu-btn small { display: block; color: var(--dim); }
  .back { background: none; border: none; color: var(--dim); text-decoration: underline; padding: 8px; }

  /* fighters list */
  .fighter-card {
    display: block; width: 100%; max-width: 520px; margin: 10px auto; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    text-align: left; color: var(--ink); transition: border-color .15s;
  }
  .fighter-card:hover { border-color: var(--gold); }
  .fighter-card.disabled { opacity: .5; cursor: default; }
  .fighter-card.disabled:hover { border-color: var(--border); }
  .fighter-card .fname { font-size: 17px; }
  .fighter-card .fart { font-variant: small-caps; letter-spacing: 1px; }
  .fighter-card .fdesc { color: var(--dim); font-size: 14px; font-style: italic; }

  /* deck builder */
  #builder-stats {
    position: sticky; top: 0; z-index: 4; background: var(--bg);
    padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 10px;
    font-size: 14px; text-align: center;
  }
  #builder-stats b { color: var(--gold); font-weight: normal; }
  #builder-stats .warn { color: var(--red); }
  #builder-stats .ok { color: #7fae6a; }
  .art-section { margin: 18px 0 6px; }
  .art-head {
    font-variant: small-caps; letter-spacing: 2px; font-size: 17px;
    border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 8px;
  }
  .pool-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 4px;
    border-bottom: 1px dotted #2a251f; font-size: 14px;
  }
  .pool-row .pname { flex: 1 1 auto; min-width: 0; }
  .pool-row .ptext { color: var(--dim); font-size: 12.5px; }
  .pool-row .pcost { color: var(--gold); white-space: nowrap; }
  .cnt-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--ink); font-size: 16px; line-height: 1;
  }
  .cnt-btn:disabled { opacity: .3; cursor: default; }
  .cnt { width: 20px; text-align: center; color: var(--gold); }
  .locked { opacity: .45; }
  .locknote { color: var(--dim); font-size: 12px; font-style: italic; }

  /* duel screen */
  #duel { max-width: 900px; margin: 0 auto; padding: 8px 10px 20px; display: none; }
  .fpanel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; margin: 6px 0;
  }
  .fpanel.active { border-color: var(--gold); box-shadow: 0 0 16px rgba(217,164,65,.12); }
  .frow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .frow .name { font-size: 16px; }
  .frow .style { font-variant: small-caps; font-size: 13px; }
  .frow .mastery { color: var(--gold); font-size: 12px; font-style: italic; }
  .hpbar { height: 12px; background: #2a1512; border-radius: 6px; overflow: hidden; margin: 5px 0 3px; position: relative; }
  .hpfill { height: 100%; background: linear-gradient(90deg, #a83a2a, #c94f3d); border-radius: 6px; transition: width .5s ease; }
  .stats { font-size: 13px; color: var(--dim); display: flex; gap: 14px; flex-wrap: wrap; }
  .stats b { color: var(--ink); font-weight: normal; }
  .statuses { font-size: 12px; margin-top: 2px; min-height: 16px; }
  .status-chip {
    display: inline-block; padding: 1px 8px; margin: 1px 4px 1px 0; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
  }
  .status-chip.bad { color: var(--red); border-color: #5a2f28; }
  .status-chip.good { color: #7fae6a; border-color: #34432c; }

  /* duel top bar */
  #duelbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
  #duelbar .runinfo { color: var(--gold); font-variant: small-caps; letter-spacing: 1px; }
  #duelmenu { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--dim); padding: 4px 12px; font-size: 13px; }
  #duelmenu:hover { border-color: var(--gold); color: var(--gold); }

  /* arena */
  #arena {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin: 6px 0; text-align: center;
  }
  #rangeviz { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
  .zone {
    flex: 1 1 0; max-width: 170px; padding: 6px 4px; border-radius: 8px;
    border: 1px dashed var(--border); color: var(--dim);
    font-variant: small-caps; font-size: 13px; letter-spacing: 1px;
    transition: all .35s ease;
  }
  .zone.on { border-style: solid; border-color: var(--gold); color: var(--gold); background: rgba(217,164,65,.07); }
  #topnote { font-size: 12.5px; color: var(--dim); font-style: italic; min-height: 17px; }
  #log { font-size: 13.5px; color: var(--dim); min-height: 54px; margin-top: 6px; text-align: left; }
  #log .l { animation: lrise .3s ease-out both; padding: 1px 0; }
  #log .l.hit { color: var(--ink); }
  @keyframes lrise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* hand */
  #handwrap { margin-top: 8px; }
  #hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .card {
    width: 138px; min-height: 148px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px;
    text-align: left; position: relative; color: var(--ink);
    display: flex; flex-direction: column; transition: transform .15s, border-color .15s, opacity .3s;
    border-top: 3px solid var(--dim);
  }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .card .cname { font-size: 13.5px; line-height: 1.2; }
  .card .ccost {
    font-size: 15px; color: var(--gold); min-width: 18px; height: 22px; text-align: center;
  }
  .card .cart { font-size: 10.5px; font-variant: small-caps; letter-spacing: 1px; margin: 1px 0 3px; }
  .card .cranges { font-size: 10.5px; color: var(--dim); margin-bottom: 4px; }
  .card .ctext { font-size: 12px; color: #c6bca8; flex: 1 1 auto; }
  .card.playable { cursor: pointer; }
  .card.playable:hover { transform: translateY(-5px); border-color: var(--gold); }
  .card.dead { opacity: .38; }
  button.card { font: inherit; }
  #controls { text-align: center; margin-top: 10px; }
  #endturn {
    padding: 11px 34px; border-radius: 8px; border: 1px solid var(--gold);
    background: rgba(217,164,65,.1); color: var(--gold);
    font-variant: small-caps; letter-spacing: 2px; font-size: 16px;
  }
  #endturn:disabled { opacity: .35; }
  #resetbtn {
    padding: 11px 22px; border-radius: 8px; border: 1px solid var(--dim);
    background: rgba(154,143,124,.08); color: var(--ink);
    font-variant: small-caps; letter-spacing: 1px; font-size: 15px; margin-left: 10px;
  }
  #resetbtn:hover { border-color: var(--gold); color: var(--gold); }
  #stamina-pips { display: inline-block; margin-left: 12px; letter-spacing: 3px; color: var(--gold); }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 6, .93);
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 20px;
  }
  .overlay .obox { max-width: 440px; }
  .overlay .obox.wide { max-width: 560px; width: 100%; }
  .overlay .setrow {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    max-width: 300px; margin: 12px auto; font-size: 15px;
  }
  .overlay .setrow button {
    padding: 8px 16px; background: var(--panel); border: 1px solid var(--gold);
    color: var(--gold); border-radius: 8px; min-width: 74px;
  }
  .logview {
    max-height: 62vh; overflow-y: auto; text-align: left;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; font-size: 13.5px; margin-top: 10px;
  }
  .logview .lturn {
    color: var(--gold); font-variant: small-caps; letter-spacing: 2px;
    border-bottom: 1px solid var(--border); margin: 12px 0 4px; padding-bottom: 2px;
  }
  .logview .lturn:first-child { margin-top: 0; }
  .logview .lline { color: var(--dim); padding: 1px 0; }
  .logview .lline.hit { color: var(--ink); }
  .recrow { text-align: left; }
  .recrow .rsub { color: var(--dim); font-size: 13px; }
  .recrow .rwin { color: #7fae6a; }
  .recrow .rloss { color: var(--red); }
  .overlay h2 { font-size: 26px; }
  .overlay p { color: var(--dim); }
  .overlay button { margin-top: 14px; }
  .ladder { text-align: left; max-width: 360px; margin: 10px auto; }
  .ladder .lrow { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-bottom: 1px dotted #2a251f; font-size: 14px; }
  .ladder .lrow .mark { width: 20px; text-align: center; }
  .ladder .lrow.done { color: #7fae6a; }
  .ladder .lrow.now { color: var(--gold); }
  .ladder .lrow.todo { color: var(--dim); }

  /* floaters */
  .floater {
    position: absolute; font-size: 20px; font-weight: bold; pointer-events: none;
    animation: floatup 1s ease-out both; z-index: 20; text-shadow: 0 2px 6px #000;
  }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }
  .shake { animation: shake .35s ease; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ---- effects ---- */
  .screen { animation: fadein .4s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .pico { width: 44px; height: 44px; flex: 0 0 auto; }
  .pico svg { width: 100%; height: 100%; display: block; }
  .fighter-card { display: flex; gap: 14px; align-items: center; }
  .fighter-card .pico { width: 62px; height: 62px; }
  .fighter-card .fbody { flex: 1 1 auto; min-width: 0; }
  .fighter-card .quote { color: var(--gold); font-style: italic; font-size: 13px; margin-top: 3px; }
  #banner {
    position: fixed; top: 38%; left: 0; right: 0; z-index: 30; text-align: center;
    font-variant: small-caps; letter-spacing: 6px; font-size: 30px; color: var(--gold);
    text-shadow: 0 0 34px rgba(217,164,65,.55); pointer-events: none; opacity: 0;
  }
  #banner.show { animation: bannersweep 1.1s ease-in-out both; }
  @keyframes bannersweep {
    0% { opacity: 0; transform: translateX(-44px); }
    20% { opacity: 1; transform: none; }
    78% { opacity: 1; }
    100% { opacity: 0; transform: translateX(44px); }
  }
  .card.zoomout { transform: scale(1.14) translateY(-16px) !important; opacity: 0 !important; transition: all .2s ease-in !important; }
  .impact {
    position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(201,79,61,.4), transparent 70%);
    animation: impactfade .45s ease-out both;
  }
  @keyframes impactfade { from { opacity: 1; } to { opacity: 0; } }
  .kotext {
    font-size: 56px; font-variant: small-caps; letter-spacing: 8px; color: var(--red);
    text-shadow: 0 0 44px rgba(201,79,61,.6); margin: 0 0 6px;
    animation: kopunch .5s cubic-bezier(.2, 2.2, .4, 1) both;
  }
  @keyframes kopunch { from { transform: scale(2.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .zone .who { display: block; font-size: 15px; letter-spacing: 2px; min-height: 20px; }
  .hpfill { transition: width .5s ease, background .5s; }
  .hpbar.low .hpfill { background: linear-gradient(90deg, #7a1f14, #a83a2a); animation: hppulse 1s ease-in-out infinite; }
  @keyframes hppulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }

  /* ---- mobile ---- */
  @media (max-width: 560px) {
    body { font-size: 15px; }
    #duel { padding: 6px 6px 14px; }
    .fpanel { padding: 7px 9px; margin: 5px 0; }
    .card { width: calc(33.33% - 6px); min-width: 0; min-height: 132px; padding: 6px 7px; }
    .card .cname { font-size: 11.5px; }
    .card .ctext { font-size: 10px; }
    .card .cranges { font-size: 9.5px; }
    .card .cart { font-size: 9.5px; }
    .zone { font-size: 10.5px; padding: 5px 2px; }
    .zone .who { font-size: 13px; }
    h1 { font-size: 24px; letter-spacing: 4px; }
    .stats { gap: 9px; font-size: 11.5px; }
    .statuses { font-size: 11px; }
    .pico { width: 36px; height: 36px; }
    .fighter-card .pico { width: 52px; height: 52px; }
    #banner { font-size: 22px; letter-spacing: 4px; }
    .kotext { font-size: 40px; letter-spacing: 5px; }
    #log { font-size: 12.5px; min-height: 48px; }
    #endturn { width: 100%; padding: 14px 0; font-size: 17px; }
    #resetbtn { width: 100%; margin: 8px 0 0; padding: 12px 0; }
    #stamina-pips { display: block; margin: 8px 0 0; font-size: 18px; }
    .pool-row .ptext { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body.no-motion *, body.no-motion *::before, body.no-motion *::after {
    animation: none !important; transition: none !important;
  }

  /* ---- accessibility ---- */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }
  .kbfocus { outline: 3px solid var(--gold) !important; outline-offset: 2px; }

  /* ---- balance simulator ---- */
  .simtable { border-collapse: collapse; margin: 10px auto; font-size: 12px; }
  .simtable th, .simtable td { border: 1px solid var(--border); padding: 3px 7px; text-align: center; white-space: nowrap; }
  .simtable th { color: var(--gold); font-weight: normal; }
  .simtable td.hot { color: var(--red); }
  .simtable td.cold { color: #7fae6a; }
  .simcard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 10px auto; max-width: 620px; }
  .simcard b { color: var(--gold); font-weight: normal; }
  .simcard .flag { color: var(--red); }
  .simcard .good { color: #7fae6a; }

  /* ---- onboarding ---- */
  .howto p { max-width: 620px; margin: 12px auto; }
  .howto b { color: var(--gold); font-weight: normal; }
  .glossary { max-width: 620px; margin: 16px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 14px; }
  .glossary > b { color: var(--gold); display: block; margin-bottom: 6px; font-variant: small-caps; letter-spacing: 1px; }
  .glossary div { padding: 3px 0; color: var(--dim); }
  .glossary .gk { color: var(--ink); }
  .status-chip[title] { cursor: help; }
  #coach {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(20, 17, 14, .97); border-top: 2px solid var(--gold);
    color: var(--ink); padding: 12px 16px 14px; font-size: 14px; text-align: center;
    transform: translateY(115%); transition: transform .3s ease;
  }
  #coach.show { transform: none; }
  #coach .ctext { color: var(--ink); }
  #coach #coach-skip { color: var(--gold); }
  #duel.tutorial { padding-bottom: 108px; }
</style>
</head>
<body>

<footer style="max-width:860px;margin:0 auto;padding:12px 14px;border-bottom:1px solid var(--border);
  font-size:13px;color:var(--dim);text-align:center">
  <b style="color:var(--gold);font-weight:normal;font-variant:small-caps;letter-spacing:2px">Masters of the Way</b>
  · a martial arts card battler built from six real arts: master one way, or take what works from everywhere.
  Part of <a href="https://peterdsouza247.github.io/pocs/" style="color:var(--gold)">Peter's POCs</a>
  · <a href="https://peterdsouza247.github.io/pocs/gdds/gdd_masters_of_the_way.html" style="color:var(--dim)">design document</a> · © 2026 Peter Brendan
</footer>

<div id="app"></div>
<div id="banner" aria-hidden="true"></div>
<div id="a11y-live" class="sr-only" role="status" aria-live="assertive"></div>
<div id="coach" aria-hidden="true"></div>
<div id="duel" role="application" aria-label="Duel board">
  <div id="duelbar">
    <span class="runinfo" id="runinfo"></span>
    <button id="duelmenu">☰ Menu</button>
  </div>
  <div class="fpanel" id="panel-1">
    <div class="frow"><span class="pico" id="pico-1"></span><span class="name" id="name-1"></span><span class="style" id="style-1"></span><span class="mastery" id="mastery-1"></span></div>
    <div class="hpbar"><div class="hpfill" id="hp-1"></div></div>
    <div class="stats"><span>HP <b id="hpn-1"></b></span><span>Guard <b id="guard-1"></b></span><span>Hand <b id="handn-1"></b></span><span>Deck <b id="deckn-1"></b></span></div>
    <div class="statuses" id="status-1"></div>
  </div>

  <div id="arena">
    <div id="rangeviz">
      <div class="zone" id="zone-far" title="Kicking range. Taekwondo and Karate thrive here.">Far · kicking range</div>
      <div class="zone" id="zone-close" title="The pocket. Boxing, Muay Thai, and grappling setups.">Close · in the pocket</div>
      <div class="zone" id="zone-ground" title="On the mat. Top position controls the fight. BJJ's domain.">Ground</div>
    </div>
    <div id="topnote" aria-live="polite"></div>
    <div id="log" role="log" aria-live="polite" aria-atomic="false"></div>
    <div style="text-align:right"><button id="viewlog" class="back" style="font-size:12.5px">full fight log</button></div>
  </div>

  <div class="fpanel" id="panel-0">
    <div class="frow"><span class="pico" id="pico-0"></span><span class="name" id="name-0"></span><span class="style" id="style-0"></span><span class="mastery" id="mastery-0"></span></div>
    <div class="hpbar"><div class="hpfill" id="hp-0"></div></div>
    <div class="stats"><span>HP <b id="hpn-0"></b></span><span>Guard <b id="guard-0"></b></span><span>Deck <b id="deckn-0"></b></span></div>
    <div class="statuses" id="status-0"></div>
  </div>

  <div id="handwrap">
    <div id="hand"></div>
    <div id="controls">
      <button id="endturn">End Turn</button>
      <button id="resetbtn" style="display:none">Reset stance</button>
      <span id="stamina-pips"></span>
    </div>
  </div>
</div>

<script>
"use strict";

/* ================================================================ helpers */

const $ = (id) => document.getElementById(id);
const app = $("app");
const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ================================================================ settings */

const SET_KEY = "motw-settings-v1";
let SETTINGS = loadSettings();
function loadSettings() {
  const d = { sound: true, reduceMotion: false, difficulty: "normal" };
  try {
    const s = JSON.parse(localStorage.getItem(SET_KEY));
    if (s && typeof s === "object") return Object.assign(d, s);
  } catch (e) {}
  return d;
}
function saveSettings() {
  try { localStorage.setItem(SET_KEY, JSON.stringify(SETTINGS)); } catch (e) {}
  applySettings();
}
function applySettings() {
  document.body.classList.toggle("no-motion", !!SETTINGS.reduceMotion);
}

/* ================================================================ audio (synth, no files) */

const Sound = (function () {
  let ctx = null;
  function ac() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    return ctx;
  }
  function tone(freq, dur, type, gain, slideTo) {
    if (HEADLESS || !SETTINGS.sound) return;
    const c = ac(); if (!c) return;
    if (c.state === "suspended") c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.2, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.03);
  }
  function noise(dur, gain, cutoff) {
    if (HEADLESS || !SETTINGS.sound) return;
    const c = ac(); if (!c) return;
    if (c.state === "suspended") c.resume();
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 1200;
    const g = c.createGain(); g.gain.value = gain || 0.25;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  }
  return {
    resume() { const c = ac(); if (c && c.state === "suspended") c.resume(); },
    hit() { noise(0.16, 0.32, 950); tone(150, 0.13, "square", 0.10, 70); },
    heavy() { noise(0.28, 0.42, 700); tone(95, 0.22, "square", 0.16, 45); },
    block() { tone(330, 0.10, "triangle", 0.10, 250); noise(0.05, 0.13, 2200); },
    takedown() { noise(0.42, 0.4, 480); tone(72, 0.34, "sine", 0.18, 38); },
    bleed() { tone(230, 0.24, "sine", 0.07, 150); },
    ui() { tone(540, 0.05, "triangle", 0.06); },
    ko() { noise(0.5, 0.48, 620); tone(190, 0.5, "square", 0.20, 40); },
    tap() { tone(460, 0.28, "sine", 0.14, 240); setTimeout(() => tone(300, 0.4, "sine", 0.12, 180), 180); },
    bell() { tone(880, 0.5, "sine", 0.13, 860); tone(1320, 0.45, "sine", 0.06); },
    win() {
      tone(523, 0.16, "sine", 0.13);
      setTimeout(() => tone(659, 0.16, "sine", 0.13), 150);
      setTimeout(() => tone(784, 0.32, "sine", 0.13), 310);
    },
  };
})();

/* ================================================================ decks */

const DECK_SIZE = 20;
const MAX_COPIES = 2;
const MASTER_COPIES = 1;
const PURITY_THRESHOLD = 0.75;

function pureDeck(art) {
  const pool = CARDS.filter((c) => c.art === art && !c.master);
  const masters = CARDS.filter((c) => c.art === art && c.master);
  const deck = [];
  for (const c of pool) { deck.push(c.id, c.id); }         // 8 x2 = 16
  for (const m of masters) deck.push(m.id);                 // +2
  deck.push("breathe", "highguard");                        // +2 neutral = 20
  return deck;
}

const PREBUILT = {
  boxing:    { name: "The Sweet Science (pure Boxing)", cards: pureDeck("boxing") },
  karate:    { name: "Empty Hand (pure Karate)", cards: pureDeck("karate") },
  taekwondo: { name: "Foot Fist Way (pure Taekwondo)", cards: pureDeck("taekwondo") },
  muaythai:  { name: "Eight Limbs (pure Muay Thai)", cards: pureDeck("muaythai") },
  judo:      { name: "The Gentle Way (pure Judo)", cards: pureDeck("judo") },
  bjj:       { name: "Arte Suave (pure BJJ)", cards: pureDeck("bjj") },
  mma:       { name: "The Mongrel (MMA mix)", cards: [
    "jab","jab","cross","hook","bobweave","footwork",
    "teep","lowkick","elbow","knee","clinch",
    "shoot","shoot","passguard","gnp","armbar","standup","sweep",
    "advance","highguard",
  ] },
};

function deckStats(cardIds) {
  const counts = {};
  let nonNeutral = 0;
  for (const id of cardIds) {
    const a = CARD[id].art;
    if (a !== "neutral") { counts[a] = (counts[a] || 0) + 1; nonNeutral += 1; }
  }
  let topArt = null;
  for (const a of Object.keys(counts))
    if (!topArt || counts[a] > counts[topArt]) topArt = a;
  const purity = topArt && nonNeutral ? counts[topArt] / nonNeutral : 0;
  const arts = Object.keys(counts).length;
  return {
    counts, topArt, purity, arts,
    mastery: purity >= PURITY_THRESHOLD ? topArt : null,
    handSize: Math.min(7, 4 + Math.max(1, arts)),
  };
}

// Reject corrupted / illegal saved decks before they enter a match.
function validateDeck(cardIds) {
  if (!Array.isArray(cardIds) || cardIds.length !== DECK_SIZE) return false;
  const counts = {};
  for (const id of cardIds) {
    const c = CARD[id];
    if (!c) return false;
    counts[id] = (counts[id] || 0) + 1;
    const max = c.master ? MASTER_COPIES : MAX_COPIES;
    if (counts[id] > max) return false;
  }
  const st = deckStats(cardIds);
  for (const id of Object.keys(counts)) {
    if (CARD[id].master && st.mastery !== CARD[id].art) return false;
  }
  return true;
}

      <path d="M30 44 Q30 18 50 18 Q70 18 70 44 L70 56 Q60 48 50 48 Q40 48 30 56 Z" fill="#1d1813" stroke="#9a8f7c" stroke-width="2"/>
      <rect x="24" y="66" width="10" height="5" rx="2" fill="#cfc9b8" opacity=".7"/><rect x="66" y="66" width="10" height="5" rx="2" fill="#cfc9b8" opacity=".7"/>`),
  };

}
function portraitFor(stats) {
  if (stats.mastery) return portraitSVG(stats.mastery);

}

/* ================================================================ duel state */

let M = null;   // match state
let humanResolve = null;

function newFighter(name, deckIds, human, persona) {
  const stats = deckStats(deckIds);
  return {
    name, human, persona,
    hp: 30, maxhp: 30, stamina: 0, guard: 0,
    deck: shuffle(deckIds.slice()), hand: [], discard: [],
    stats,
    st: { stagger:0, bleed:[], clinch:0, grip:0, control:0, counter:0, staminaNext:0, strikeBuffTurns:0 },
    turnFlags: {},
  };
}

function startDuel(p0, p1) {
  M = { p: [p0, p1], range: "far", top: null, active: 1, over: false, turnNo: 0, method: "K.O.", history: [],
        difficulty: SETTINGS.difficulty, hotseat: false, gauntlet: false, abandoned: false, stall: 0, seats: null };
  $("viewlog").onclick = () => showFightLog(M.history, `${p0.name} vs ${p1.name}`);
  $("duelmenu").onclick = openPause;

  $("app").style.display = "none";

/* ================================================================ rendering */

function render() {
  if (HEADLESS) return;
  const [me, foe] = [M.p[0], M.p[1]];
  for (const i of [0, 1]) {
    const f = M.p[i];
    $("name-" + i).textContent = f.name;
    const s = f.stats;
    const styleName = s.mastery ? ARTS[s.mastery].name + " (mastery)" :
      s.arts > 1 ? s.arts + " arts (cross-trained)" : (s.topArt ? ARTS[s.topArt].name : "unknown style");
    $("style-" + i).textContent = styleName;
    $("style-" + i).style.color = s.topArt ? ARTS[s.topArt].color : "var(--dim)";
    $("mastery-" + i).textContent = s.mastery ? "✦" : "";
    $("hp-" + i).style.width = Math.max(0, (f.hp / f.maxhp) * 100) + "%";
    $("hp-" + i).parentElement.classList.toggle("low", f.hp <= 10);
    $("hpn-" + i).textContent = Math.max(0, f.hp) + "/" + f.maxhp;
    $("guard-" + i).textContent = f.guard;
    $("deckn-" + i).textContent = f.deck.length + "+" + f.discard.length;
    if (i === 1) $("handn-1").textContent = f.hand.length;
    $("status-" + i).innerHTML = statusChips(f);
    $("panel-" + i).classList.toggle("active", M.active === i && !M.over);
  }
  for (const z of ["far", "close", "ground"])
    $("zone-" + z).classList.toggle("on", M.range === z);
  $("topnote").textContent = M.range === "ground"
    ? (M.top !== null ? M.p[M.top].name + " has top position." : "Scramble on the ground.")
    : (M.range === "close" ? "Trading in the pocket." : "Probing at distance.");
  renderHand();
  if (M.tutorial && !M.over) tutorialCheck();
}

function statusChips(f) {
  const chips = [];
  const chip = (cls, label, title) => `<span class="status-chip ${cls}" title="${title}" role="note" aria-label="${label}. ${title}">${label}</span>`;
  if (f.st.stagger) chips.push(chip("bad", "Staggered", "-1 stamina on their next turn."));
  if (f.st.bleed.length) chips.push(chip("bad", `Bleeding ${f.st.bleed.length}`, "Loses HP at the start of each of their turns."));
  if (f.st.clinch) chips.push(chip("bad", "Clinched", "Can't change range next turn. Trapped in the pocket."));
  if (f.st.grip) chips.push(chip("good", "Grip", "Your next throw deals +2."));
  if (f.st.control) chips.push(chip("good", "Control", "Top dominance: your submissions +3 and ground strikes +1."));
  if (f.st.counter) chips.push(chip("good", `Counter ${f.st.counter}`, "The next strike against you costs the attacker HP."));
  if (f.st.strikeBuffTurns > 0) chips.push(chip("good", "Iron Shins", "Your strikes deal +1 this turn and next."));
  return chips.join("");
}

function renderHand() {
  if (HEADLESS) return;
  const f = M.p[M.active];
  const hand = $("hand");
  hand.innerHTML = "";
  const show = f.human && !M.over;
  $("handwrap").style.visibility = show ? "visible" : "hidden";
  if (!show) { $("stamina-pips").textContent = ""; return; }
  f.hand.forEach((id, idx) => {
    const c = CARD[id];
    const ok = canPlay(f, c);
    const b = document.createElement("button");
    b.className = "card " + (ok ? "playable" : "dead");
    b.style.borderTopColor = ARTS[c.art].color;
    b.innerHTML =
      `<span class="top"><span class="cname">${c.name}</span><span class="ccost">${c.cost}◈</span></span>` +
      `<span class="cart" style="color:${ARTS[c.art].color}">${ARTS[c.art].name}${c.master ? " ✦" : ""}</span>` +
      `<span class="cranges">${c.ranges.map(cap).join(" · ")}${c.needTop ? " · top" : ""}</span>` +
      `<span class="ctext">${c.text}</span>`;
    b.setAttribute("aria-label", `Card ${idx + 1}: ${c.name}, ${ARTS[c.art].name}, cost ${c.cost}. ${c.text} ${ok ? "Playable." : "Not playable now."}`);
    b.setAttribute("aria-disabled", ok ? "false" : "true");
    if (ok) b.onclick = () => {
      b.onclick = null;
      Sound.resume(); Sound.ui();
      b.classList.add("zoomout");
      setTimeout(() => playCard(f, idx), 170);
    };
    hand.appendChild(b);
  });
  $("stamina-pips").textContent = "◈".repeat(f.stamina) + "·".repeat(Math.max(0, 5 - f.stamina));
  $("endturn").disabled = false;
  // Reset stance (mulligan): only offered when nothing in hand is playable.
  const rb = $("resetbtn");
  if (rb) {
    const anyPlayable = f.hand.some((id) => canPlay(f, CARD[id]));
    if (!anyPlayable && f.hand.length && f.stamina >= RESET_COST && !f.turnFlags.reset) {
      rb.style.display = "";
      rb.textContent = `Reset stance (${RESET_COST}◈)`;
      rb.onclick = () => { Sound.ui(); resetStance(f); };
    } else {
      rb.style.display = "none";
    }
  }
}

function logLine(text, strong) {
  if (HEADLESS) return;
  const d = document.createElement("div");
  d.className = "l" + (strong ? " hit" : "");
  d.textContent = text;
  const log = $("log");
  log.appendChild(d);
  while (log.children.length > 4) log.removeChild(log.firstChild);
  if (M && M.history) M.history.push({ t: text, hit: !!strong });
}

function showFightLog(history, title, backLabel) {
  const o = el(`<div class="overlay"><div class="obox wide">
    <h2>${title}</h2>
    <div class="logview" id="lv"></div>
    <button class="menu-btn" style="text-align:center" id="lv-close">${backLabel || "Close"}</button>
  </div></div>`);
  document.body.appendChild(o);
  const lv = o.querySelector("#lv");
  for (const e of history) {
    const d = document.createElement("div");
    if (e.marker) { d.className = "lturn"; d.textContent = e.marker; }
    else { d.className = "lline" + (e.hit ? " hit" : ""); d.textContent = e.t; }
    lv.appendChild(d);
  }
  lv.scrollTop = lv.scrollHeight;
  o.querySelector("#lv-close").onclick = () => o.remove();
}

function bannerShow(text) {
  if (HEADLESS) return;
  announce(text);
  const b = $("banner");
  b.textContent = text;
  b.classList.remove("show");
  void b.offsetWidth;
  b.classList.add("show");
}

function impactFlash(panelId) {
  if (HEADLESS) return;
  const panel = $(panelId);
  panel.style.position = "relative";
  const d = document.createElement("div");
  d.className = "impact";
  panel.appendChild(d);
  setTimeout(() => d.remove(), 500);
}

function floater(panelId, text, color) {
  if (HEADLESS) return;
  const panel = $(panelId);
  const s = document.createElement("span");
  s.className = "floater";
  s.textContent = text;
  s.style.color = color || "var(--red)";
  s.style.left = (30 + Math.random() * 40) + "%";
  s.style.top = "8px";
  panel.style.position = "relative";
  panel.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

/* ================================================================ rules */

function canPlay(f, c) {
  if (M.over) return false;
  if (c.cost > f.stamina) return false;
  if (!c.ranges.includes(M.range)) return false;
  const meIdx = M.p.indexOf(f);
  if (c.needTop && (M.range !== "ground" || M.top !== meIdx)) return false;
  if (c.fx && (c.fx.takedown || c.fx.takedownIfGrip) && M.range !== "close") return false;
  return true;
}

function draw(f, n) {
  for (let i = 0; i < n; i++) {
    if (!f.deck.length) {
      if (!f.discard.length) return;
      f.deck = shuffle(f.discard);
      f.discard = [];
    }
    if (f.hand.length >= 9) return;
    f.hand.push(f.deck.pop());
  }
}

function isKick(c) {
  return /chagi|geri|kick|teep|roundhouse|khao/i.test(c.name) || c.id === "kick540";
}

function strikeDamage(att, def, c, commit) {
  let dmg = c.dmg || 0;
  const tf = att.turnFlags;
  // combo: consecutive same-art cards
  if (tf.lastArt === c.art && c.art !== "neutral" && tf.comboCount >= 1) dmg += 1;
  // one-shot buffs
  if (tf.nextStrike) { dmg += tf.nextStrike; if (commit) tf.nextStrike = 0; }
  if (tf.strikeAll) dmg += tf.strikeAll;
  if (att.st.strikeBuffTurns > 0) dmg += 1;
  // conditionals
  const fx = c.fx || {};
  if (fx.bonusVsStagger && def.st.stagger) dmg += fx.bonusVsStagger;
  if (fx.bonusIfClinch && def.st.clinch) dmg += fx.bonusIfClinch;
  if (fx.bonusIfLowHP && def.hp <= 10) dmg += fx.bonusIfLowHP;
  if (fx.bonusFirst && tf.cardsPlayed === 0) dmg += fx.bonusFirst;
  // mastery passives
  if (att.stats.mastery === "karate" && !tf.firstStrikeUsed && (c.type === "strike" || c.type === "sub")) {
    dmg += 2;
    if (commit) tf.firstStrikeUsed = true;
  }
  if (att.stats.mastery === "taekwondo" && M.range === "far") dmg += 1;
  if (att.stats.mastery === "bjj" && c.type === "sub") dmg += 2;
  // control bonuses
  if (c.type === "sub" && att.st.control) dmg += 3;
  if (c.type === "strike" && M.range === "ground" && att.st.control) dmg += 1;
  // judo grip on throws
  if ((fx.takedown || fx.takedownIfGrip) && att.st.grip) { dmg += 2; }
  return dmg;
}

function applyDamage(att, def, c, dmg) {
  const defIdx = M.p.indexOf(def);
  const fx = c.fx || {};
  // counter fires first
  if (def.st.counter && (c.type === "strike" || c.type === "sub")) {
    att.hp -= def.st.counter;
    logLine(`${def.name} counters for ${def.st.counter}!`, true);
    floater("panel-" + M.p.indexOf(att), "-" + def.st.counter, "var(--red)");
    Sound.block();
    def.st.counter = 0;
    if (att.hp <= 0) return;
  }
  // guard absorbs; ignoreGuard bypasses (does not destroy) up to N points of guard
  const ignore = Math.min(fx.ignoreGuard || 0, def.guard);
  const effectiveGuard = def.guard - ignore;
  const absorbed = Math.min(effectiveGuard, dmg);
  def.guard = Math.max(0, def.guard - absorbed);   // only guard that actually blocked is spent
  const remaining = dmg - absorbed;
  if (remaining > 0) {
    def.hp -= remaining;
    floater("panel-" + defIdx, "-" + remaining);
    impactFlash("panel-" + defIdx);
    (remaining >= 5 ? Sound.heavy() : Sound.hit());
    $("panel-" + defIdx).classList.remove("shake");
    void $("panel-" + defIdx).offsetWidth;
    $("panel-" + defIdx).classList.add("shake");
  } else if (dmg > 0) {
    floater("panel-" + defIdx, "blocked", "var(--dim)");
    Sound.block();
  }
}

function playCard(f, handIdx) {
  const foe = M.p[1 - M.p.indexOf(f)];
  const meIdx = M.p.indexOf(f);
  const id = f.hand[handIdx];
  const c = CARD[id];
  if (!canPlay(f, c)) return;
  f.hand.splice(handIdx, 1);
  f.discard.push(id);
  f.stamina -= c.cost;
  const fx = c.fx || {};
  const tf = f.turnFlags;
  const hadGrip = f.st.grip > 0;

  let msg = `${f.name}: ${c.name}`;

  // damage
  if (c.dmg !== undefined || c.type === "strike" || c.type === "sub") {
    const dmg = strikeDamage(f, foe, c, true);
    if (dmg > 0) { applyDamage(f, foe, c, dmg); msg += ` (${dmg})`; }
  }
  // guard
  if (c.guard) { f.guard = Math.min(8, f.guard + c.guard); }
  // grip consumed by throws
  if ((fx.takedown || (fx.takedownIfGrip && hadGrip)) && f.st.grip) f.st.grip = 0;

  // statuses on foe
  if (fx.stagger) foe.st.stagger = 1;
  if (fx.staggerIfRepeat && tf.lowKicks >= 1) foe.st.stagger = 1;
  if (fx.bleed) {
    let n = fx.bleed;
    if (f.stats.mastery === "muaythai") n += 1;
    for (let i = 0; i < 2; i++) foe.st.bleed.push(n); // 2 turns of n dmg
    msg += ". Blood.";
  }
  if (fx.clinch) foe.st.clinch = 1;
  if (fx.counter) f.st.counter = Math.max(f.st.counter, fx.counter);
  if (fx.grip) f.st.grip = 1;
  if (fx.control) { f.st.control = 1; foe.st.control = 0; }
  if (fx.stripTokens) { foe.st.grip = 0; foe.st.control = 0; }
  if (fx.nextStrike) tf.nextStrike = (tf.nextStrike || 0) + fx.nextStrike;
  if (fx.nextStrikeAll) tf.strikeAll = (tf.strikeAll || 0) + fx.nextStrikeAll;
  if (fx.strikeBuff2Turns) f.st.strikeBuffTurns = 2;
  if (fx.staminaNext) f.st.staminaNext += fx.staminaNext;
  if (fx.draw) draw(f, fx.draw);

  // position changes (clinched fighters can't move the fight)
  const clinched = f.st.clinch === 2; // set to 2 during their own turn
  if (!clinched) {
    if (fx.takedown) { M.range = "ground"; M.top = meIdx; msg += ". TAKEDOWN!"; Sound.takedown(); clearOnPositionChange(); }
    else if (fx.takedownIfGrip && hadGrip) { M.range = "ground"; M.top = meIdx; msg += ". TAKEDOWN!"; Sound.takedown(); clearOnPositionChange(); }
    if (fx.pullguard) { M.range = "ground"; M.top = 1 - meIdx; msg += ". Pulls guard."; Sound.takedown(); clearOnPositionChange(); }
    if (fx.sweep && M.range === "ground") {
      M.top = meIdx;
      msg += ". SWEEP!";
      Sound.takedown();
      foe.st.control = 0;
    }
    if (fx.standup && M.range === "ground") { M.range = "close"; M.top = null; clearControl(); msg += ". Back to the feet."; }
    if (fx.shift) {
      if (M.range !== "ground") {
        M.range = fx.shift === "toggle" ? (M.range === "far" ? "close" : "far") : fx.shift;
      }
    }
    if (fx.push && M.range === "close") { M.range = "far"; msg += ". Pushed away."; }
  } else if (fx.takedown || fx.shift || fx.push || fx.standup || fx.pullguard) {
    msg += " (clinched: can't move the fight)";
  }

  // judo mastery: takedowns stagger
  if (f.stats.mastery === "judo" && fx.takedown) foe.st.stagger = 1;

  // combo bookkeeping
  if (tf.lastArt === c.art && c.art !== "neutral") tf.comboCount += 1;
  else tf.comboCount = 0;
  tf.lastArt = c.art;
  tf.cardsPlayed += 1;
  if (c.id === "lowkick") tf.lowKicks = (tf.lowKicks || 0) + 1;

  logLine(msg, (c.dmg || 0) > 0);

  // submission tap check
  if (c.type === "sub" && foe.hp > 0) {
    const threshold = fx.tap || 0;
    if (foe.hp <= threshold) {
      foe.hp = 0;
      M.method = "Tap Out";
      logLine(`${foe.name} taps out!`, true);
    }
  }
  checkEnd();
  render();
}

function clearOnPositionChange() {
  for (const f of M.p) { f.st.grip = 0; }
}
function clearControl() {
  for (const f of M.p) { f.st.control = 0; }
}

function checkEnd() {
  for (const i of [0, 1]) {
    if (M.p[i].hp <= 0 && !M.over) {
      M.over = true;
      const w = M.p[1 - i], l = M.p[i];
      if (!HEADLESS) setTimeout(() => showResult(w, l), 600);
    }
  }
}

const STALL_LIMIT = 3;   // consecutive no-action turns before the referee steps in
const MAX_TURNS = 120;   // hard cap so a duel can never run forever
const RESET_COST = 1;    // stamina paid to reset your stance (mulligan) when stuck

// End a duel with an explicit winner (used by decision and forfeit).
function finishMatch(winnerIdx) {
  if (M.over) return;
  M.over = true;
  const w = M.p[winnerIdx], l = M.p[1 - winnerIdx];
  logLine(`${w.name} wins by ${M.method.toLowerCase()}.`, true);
  if (!HEADLESS) setTimeout(() => showResult(w, l), 600);
}

// A duel neither fighter is progressing goes to the judges (higher HP wins).
function endByDecision() {
  if (M.over) return;
  const [a, b] = M.p;
  let winnerIdx;
  if (a.hp !== b.hp) winnerIdx = a.hp > b.hp ? 0 : 1;
  else if (a.guard !== b.guard) winnerIdx = a.guard > b.guard ? 0 : 1;
  else winnerIdx = 1 - M.active;   // tie: the fighter not on the clock takes it
  M.method = "Decision";
  finishMatch(winnerIdx);
}

// TI-001: after each turn, detect and break stalemates so a fight can't loop forever.
function advanceStall(done) {
  if (done.turnFlags.cardsPlayed === 0) M.stall = (M.stall || 0) + 1;
  else M.stall = 0;
  if (M.over) return;
  if (M.stall >= STALL_LIMIT) {
    if (M.range !== "close") {
      M.range = "close"; M.top = null; clearControl();
      for (const p of M.p) p.st.grip = 0;
      logLine("Nothing doing at range. The referee brings them together.", true);
      M.stall = 0;
    } else {
      endByDecision();
    }
  }
  if (!M.over && M.turnNo >= MAX_TURNS) endByDecision();
}

// Mulligan: when a fighter has no playable card, spend stamina to discard the
// hand and redraw to hand size. Once per turn. Gives the player and the AI a
// way out of a range standoff, complementing the referee backstop (TI-001).
function resetStance(f) {
  const tf = f.turnFlags;
  if (M.over || tf.reset || f.stamina < RESET_COST || !f.hand.length) return;
  if (f.hand.some((id) => canPlay(f, CARD[id]))) return;   // only when fully stuck
  f.stamina -= RESET_COST;
  tf.reset = true;
  for (const id of f.hand) f.discard.push(id);
  f.hand = [];
  draw(f, f.stats.handSize);
  logLine(`${f.name} resets stance and redraws (-${RESET_COST} stamina).`, true);
  render();
}
function aiShouldReset(f) {
  return f.stamina >= RESET_COST && !f.turnFlags.reset && f.hand.length > 0;
}

/* ================================================================ turns */

// Shared start-of-turn resolution, used by both the live loop and the sim.
function startOfTurn(f) {
  if (!HEADLESS) M.history.push({ marker: `Turn ${M.turnNo} · ${f.name} · ${cap(M.range)}${M.range === "ground" && M.top !== null ? " (" + M.p[M.top].name + " on top)" : ""}` });
  // start-of-turn: bleed
  if (f.st.bleed.length) {
    const b = f.st.bleed.shift();
    f.hp -= b;
    logLine(`${f.name} bleeds for ${b}.`);
    floater("panel-" + M.active, "-" + b);
    Sound.bleed();
    checkEnd();
    if (M.over) return;
  }
  // guard resets at the start of your own turn
  f.guard = 0;
  if (f.stats.mastery === "boxing") f.guard = 1;
  // counter is a reaction window: it expires at the start of your own next turn if unused
  f.st.counter = 0;
  // stamina
  f.stamina = 3 + f.st.staminaNext - (f.st.stagger ? 1 : 0);
  f.stamina = Math.max(0, Math.min(5, f.stamina));
  f.st.staminaNext = 0;
  if (f.st.stagger) logLine(`${f.name} is staggered (-1 stamina).`);
  f.st.stagger = 0;
  // clinch: mark as active this turn, then clear
  f.st.clinch = f.st.clinch ? 2 : 0;
  // buffs tick
  if (f.st.strikeBuffTurns > 0) f.st.strikeBuffTurns -= 1;
  f.turnFlags = { lastArt: null, comboCount: 0, cardsPlayed: 0, nextStrike: 0, strikeAll: 0, firstStrikeUsed: false, lowKicks: 0, reset: false, gripSnapshot: f.st.grip > 0 };
  // draw to hand size
  draw(f, Math.max(0, f.stats.handSize - f.hand.length));
}

async function nextTurn() {
  if (M.over) return;
  M.active = 1 - M.active;
  M.turnNo += 1;
  const f = M.p[M.active];
  const foe = M.p[1 - M.active];

  startOfTurn(f);
  render();
  if (M.over) return;
  if (M.turnNo > 1) bannerShow(f.human && !M.hotseat ? "Your Turn" : f.name);

  if (f.human) {
    if (M.hotseat && M.turnNo > 1) await passScreen(f.name);
    if (M.over) return;
    render();
    await humanTurn();
  } else {
    await aiTurn(f, foe);
  }
  if (M.over) return;
  // end of turn cleanup
  const done = M.p[M.active];
  done.st.clinch = 0; // clinch on them expires after their turn
  advanceStall(done);
  if (!M.over) nextTurn();
}

function humanTurn() {
  return new Promise((resolve) => {
    humanResolve = resolve;
    $("endturn").onclick = () => {
      $("endturn").onclick = null;
      Sound.ui();
      const r = humanResolve; humanResolve = null;
      r();
    };
  });
}

/* ================================================================ AI */

function aiScore(f, foe, c, persona) {
  const fx = c.fx || {};
  let score = 0;
  const dmg = strikeDamage(f, foe, c, false);
  score += dmg * (1 + persona.aggr);
  if (dmg >= foe.hp + foe.guard) score += 50;                       // finish them
  score += (c.guard || 0) * (1.6 - persona.aggr);
  if (fx.counter) score += fx.counter * (1.4 - persona.aggr);
  if (fx.bleed) score += fx.bleed * 2;
  if (fx.stagger) score += 2;
  if (fx.clinch && persona.prefRange === "close") score += 3;
  if (fx.grip) score += 2.5;
  if (fx.control && !f.st.control) score += 4;
  // range strategy
  const want = persona.prefRange;
  if (fx.takedown || fx.pullguard) score += want === "ground" ? 7 : 1.5;
  if (fx.takedownIfGrip && f.st.grip) score += want === "ground" ? 7 : 2;
  if (fx.standup && want !== "ground") score += 6;
  if (fx.sweep && M.range === "ground" && M.top !== M.p.indexOf(f)) score += 8;
  if (fx.shift) {
    const to = fx.shift === "toggle" ? (M.range === "far" ? "close" : "far") : fx.shift;
    if (to === want && M.range !== want) score += 5;
    else if (M.range === want) score -= 2;
  }
  if (fx.push && M.range === "close" && want === "far") score += 4;
  if (fx.push && want === "close") score -= 2;
  if (c.type === "sub") {
    const eff = dmg;
    if (foe.hp - eff <= (fx.tap || 0)) score += 60;                 // tap incoming
    else if (foe.hp < 15) score += 4;
  }
  if (fx.draw) score += 1.5;
  if (fx.nextStrike || fx.nextStrikeAll) score += 2;
  score -= c.cost * .4;
  return score;
}

function aiRankPlays(f, foe) {
  const playable = f.hand
    .map((id, idx) => ({ c: CARD[id], idx }))
    .filter((x) => canPlay(f, x.c));
  playable.forEach((x) => { x.score = aiScore(f, foe, x.c, f.persona); });
  playable.sort((a, b) => b.score - a.score);
  return playable;
}

// Returns the chosen play, or null to end the turn. Difficulty tunes decision
// quality only. Opponents never get extra stats.
function aiSelect(playable, f, diff) {
  if (!playable.length) return null;
  let pick = playable[0];
  if (diff === "easy") {
    if (Math.random() < 0.18 && f.turnFlags.cardsPlayed > 0) return null;
    const top = playable.slice(0, Math.min(3, playable.length));
    pick = top[Math.floor(Math.random() * top.length)];
  } else if (diff === "normal") {
    if (Math.random() < 0.08 && f.turnFlags.cardsPlayed > 0 && pick.score < 3) return null;
  }
  if (pick.score < 0.5 && f.turnFlags.cardsPlayed > 0) return null;
  return pick;
}

async function aiTurn(f, foe) {
  await sleep(650);
  const diff = M.difficulty || "normal";
  let safety = 20;
  while (!M.over && safety-- > 0) {
    const plays = aiRankPlays(f, foe);
    if (!plays.length) {
      if (aiShouldReset(f)) { resetStance(f); await sleep(650); continue; }
      break;
    }
    const pick = aiSelect(plays, f, diff);
    if (!pick) break;
    playCard(f, pick.idx);
    await sleep(diff === "easy" ? 900 : 780);
  }
  await sleep(350);
}

function seatStatusText(seat) {

  Sound.ui();

function seatProfileObj(seat) {
  const base = seat.profileObj || { data: {} };
  const data = Object.assign({}, base.data || {});
  data.stats = seat.stats;
  data.decks = seat.decks || data.decks || [];
  return { app: "masters-of-the-way", type: "profile", version: 1, exportedAt: new Date().toISOString(), name: seat.name, data };
}
function downloadSeatProfile(seat) {
  const obj = seatProfileObj(seat);
  const json = JSON.stringify(obj, null, 2);
  const safe = (seat.name || "player").replace(/[^a-z0-9\-_]+/gi, "_").toLowerCase() || "player";
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `motw-profile-${safe}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

}

// TI-002: forfeit with a warning screen and confirmation. Costs the forfeiting
// player the fight as a recorded loss by knockout.
function confirmForfeit() {
  Sound.ui();
  const who = M.hotseat ? M.p[M.active].name : "You";
  const o = el(`<div class="overlay"><div class="obox">
    <h2>Forfeit?</h2>
    <p>Forfeiting ends the fight now and records it as a <b style="color:var(--red)">loss by knockout</b> for ${who}. There is no undo.</p>
    <button class="menu-btn" style="text-align:center;border-color:var(--red);color:var(--red)" id="ff-yes">Forfeit and take the loss</button>
    <button class="menu-btn" style="text-align:center" id="ff-no">Keep fighting</button>
  </div></div>`);
  document.body.appendChild(o);
  o.querySelector("#ff-no").focus();
  o.querySelector("#ff-no").onclick = () => { Sound.ui(); o.remove(); };
  o.querySelector("#ff-yes").onclick = () => { o.remove(); forfeitDuel(); };
}

function forfeitDuel() {
  if (!M || M.over) return;
  const fIdx = M.hotseat ? M.active : 0;   // solo: the human always forfeits
  M.p[fIdx].hp = 0;
  M.method = "Forfeit";
  finishMatch(1 - fIdx);
  if (humanResolve) { const r = humanResolve; humanResolve = null; r(); }
}

function quitDuel() {
  if (!M) return;
  M.over = true;
  M.abandoned = true;
  RUN = null;
  if (humanResolve) { const r = humanResolve; humanResolve = null; r(); }
  showMenu();
}

/* ================================================================ the gauntlet */

let RUN = null;
const GAUNTLET_ORDER = ["reyes", "mirae", "kanda", "barsov", "somchai", "rosa", "mongrel"];
const HEAL_BETWEEN = 12;

function showGauntletDeckSelect() {
  app.innerHTML = "";
  const opts = deckOptions();
  const s = el(`<div class="screen">
    <h2>The Gauntlet</h2>
    <div class="sub">Seven masters, in order, one run. You heal ${HEAL_BETWEEN} between fights. Lose once and it is over.</div>
    <div id="dl"></div>
    <div style="text-align:center"><button class="back" id="bk">back</button></div></div>`);
  app.appendChild(s);
  for (const o of opts) {
    const b = deckPickButton(o, (pick) => startGauntlet(pick));
    $("dl").appendChild(b);
  }
  $("bk").onclick = showMenu;
}

function startGauntlet(deck) {
  RUN = { deck, deckName: deck.name, idx: 0, wins: 0, hp: 30, difficulty: SETTINGS.difficulty };
  nextGauntletFight();
}

function nextGauntletFight() {
  if (!RUN) return;
  if (RUN.idx >= GAUNTLET_ORDER.length) { finishGauntlet(true); return; }
  const o = OPP[GAUNTLET_ORDER[RUN.idx]];
  const p0 = newFighter("You", RUN.deck.cards, true, null);
  p0.hp = RUN.hp;
  const p1 = newFighter(o.name, PREBUILT[o.deck].cards, false, o);
  startDuel(p0, p1);
  M.gauntlet = true;
}

function gauntletInterstitial(winner) {
  RUN.wins += 1;
  RUN.idx += 1;
  RUN.hp = Math.min(30, Math.max(1, winner.hp) + HEAL_BETWEEN);
  if (RUN.idx >= GAUNTLET_ORDER.length) { finishGauntlet(true); return; }
  Sound.win();
  const nextO = OPP[GAUNTLET_ORDER[RUN.idx]];
  const o = el(`<div class="overlay"><div class="obox">
    <h2>${winner.name} advances</h2>
    <p>${RUN.wins} of ${GAUNTLET_ORDER.length} masters down. You recover to <b style="color:#7fae6a">${RUN.hp} HP</b>.</p>
    ${ladderHTML()}
    <p>Next: <b style="color:var(--gold)">${nextO.name}</b><br><span style="font-style:italic">"${nextO.quote}"</span></p>
    <button class="menu-btn" style="text-align:center" id="g-next">Walk out</button>
    <button class="back" id="g-retire">retire with the streak</button>
  </div></div>`);
  document.body.appendChild(o);
  o.querySelector("#g-next").onclick = () => { Sound.ui(); o.remove(); nextGauntletFight(); };
  o.querySelector("#g-retire").onclick = () => {
    if (!confirm(`Retire now and keep your streak of ${RUN.wins}?`)) return;
    o.remove(); finishGauntlet(false, true);
  };
}

function ladderHTML() {
  const rows = GAUNTLET_ORDER.map((k, i) => {
    const o = OPP[k];
    const cls = i < RUN.idx ? "done" : (i === RUN.idx ? "now" : "todo");
    const mark = i < RUN.idx ? "x" : (i === RUN.idx ? ">" : ".");
    return `<div class="lrow ${cls}"><span class="mark">${mark}</span><span>${o.name}</span></div>`;
  }).join("");
  return `<div class="ladder">${rows}</div>`;
}

function finishGauntlet(completed, retired) {
  const wins = RUN.wins, deckName = RUN.deckName, diff = RUN.difficulty;
  saveRun(RUN, completed);
  const cleared = completed;
  const o = el(`<div class="overlay"><div class="obox">
    ${cleared ? '<div class="kotext" style="color:var(--gold)">CLEARED</div>' : ""}
    <h2>${cleared ? "The Gauntlet falls" : (retired ? "Retired undefeated" : "The run ends")}</h2>
    <p>${cleared
      ? "All seven masters, one deck, one walk. You are the way."
      : (retired
        ? `You walked away at ${wins} of ${GAUNTLET_ORDER.length}, streak intact.`
        : `You reached ${wins} of ${GAUNTLET_ORDER.length} before the run ended.`)}
      <br><span style="font-style:italic">${deckName} · ${cap(diff)}</span></p>
    <button class="menu-btn" style="text-align:center" id="g-again">Run it again</button>
    <button class="menu-btn" style="text-align:center" id="g-menu">Back to the dojo</button>
  </div></div>`);
  document.body.appendChild(o);
  if (cleared) Sound.win();
  RUN = null;
  o.querySelector("#g-again").onclick = () => { Sound.ui(); o.remove(); showGauntletDeckSelect(); };
  o.querySelector("#g-menu").onclick = () => { Sound.ui(); o.remove(); showMenu(); };
}

/* ================================================================ persistence: fights */

const FIGHTS_KEY = "motw-fights-v1";
function loadFights() {
  try { const f = JSON.parse(localStorage.getItem(FIGHTS_KEY)); if (Array.isArray(f)) return f; } catch (e) {}
  return [];
}
function saveFight(winner, loser) {
  const fights = loadFights();
  fights.unshift({
    date: new Date().toISOString().slice(0, 10),
    title: `${M.p[0].name} vs ${M.p[1].name}`,
    winner: winner.name, loser: loser.name,
    method: M.method, turns: M.turnNo,
    playerWon: winner.human && !M.hotseat,
    hotseat: !!M.hotseat,
    gauntlet: !!M.gauntlet,
    log: M.history,
  });
  try { localStorage.setItem(FIGHTS_KEY, JSON.stringify(fights.slice(0, 25))); } catch (e) {}
}

/* ================================================================ persistence: gauntlet runs */

const RUNS_KEY = "motw-runs-v1";
function loadRuns() {
  try {
    const r = JSON.parse(localStorage.getItem(RUNS_KEY));
    if (r && typeof r === "object") return { best: r.best || 0, completions: r.completions || 0, runs: Array.isArray(r.runs) ? r.runs : [] };
  } catch (e) {}
  return { best: 0, completions: 0, runs: [] };
}
function saveRun(run, completed) {
  const data = loadRuns();
  data.best = Math.max(data.best, run.wins);
  if (completed) data.completions = (data.completions || 0) + 1;
  data.runs.unshift({ date: new Date().toISOString().slice(0, 10), deck: run.deckName, wins: run.wins, completed: !!completed, difficulty: run.difficulty });
  data.runs = data.runs.slice(0, 20);
  try { localStorage.setItem(RUNS_KEY, JSON.stringify(data)); } catch (e) {}
}

function showResult(winner, loser) {
  if (M.abandoned) return;

  // Tutorial gets its own wrap-up.
  if (M.tutorial) {
    clearCoach();
    $("duel").classList.remove("tutorial");
    markTutorialDone();
    saveFight(winner, loser);
    const won = winner.human;
    const o = el(`<div class="overlay"><div class="obox">
      <div class="kotext" style="font-size:34px;color:var(--gold)">${won ? "Lesson learned" : "Good roll"}</div>
      <h2>Tutorial complete</h2>
      <p>${won
        ? "You read the range and closed the show. That's the whole game. Now take it to the roster for real."
        : "Rosa got the better of that one. That's grappling. Survive the bad position, then reverse it. Run it back, or pick a fight on your own terms."}</p>
      <button class="menu-btn" style="text-align:center" id="tut-review">Review the fight</button>
      <button class="menu-btn" style="text-align:center" id="tut-menu">To the dojo</button>
    </div></div>`);
    document.body.appendChild(o);
    announce("Tutorial complete.");
    if (won) Sound.win(); else Sound.ko();
    o.querySelector("#tut-review").focus();
    o.querySelector("#tut-review").onclick = () => showFightLog(M.history, `${M.p[0].name} vs ${M.p[1].name}`);
    o.querySelector("#tut-menu").onclick = () => { o.remove(); showMenu(); };
    return;
  }

  saveFight(winner, loser);
  if (M.method === "Tap Out") Sound.tap(); else Sound.ko();
  if (!M.hotseat) bumpDeviceStats(winner.human, M.method);

  // Gauntlet runs get their own flow.
  if (M.gauntlet && RUN) {
    if (winner.human) { setTimeout(() => gauntletInterstitial(winner), 300); return; }
    setTimeout(() => finishGauntlet(false), 300);
    return;
  }

  // Pass-and-play with per-player profiles (TI-003).
  if (M.hotseat && M.seats) { showHotseatResult(winner, loser); return; }

  const o = el(`<div class="overlay"><div class="obox">
    <div class="kotext">${M.method}</div>
    <div style="width:74px;margin:0 auto 8px" class="pico">${portraitFor(winner.stats)}</div>
    <h2>${winner.name} wins</h2>
    <p>${winner.name} by ${M.method.toLowerCase()}, turn ${M.turnNo}. ${loser.name} has nothing left.${winner.persona ? ' "' + winner.persona.quote + '"' : ""}</p>
    <button class="menu-btn" style="text-align:center" id="res-review">Review the fight</button>
    <p style="font-style:italic">"${rnd([
      "The art was the answer. The fighter was the question.",
      "Styles make fights. Preparation makes winners.",
      "Everyone has a plan until the range closes.",
      "The mat does not lie.",
      "Respect, touched gloves, and one long walk back to the locker room.",
    ])}"</p>
    <button class="menu-btn" style="text-align:center" id="res-menu">Back to the dojo</button>
  </div></div>`);
  document.body.appendChild(o);
  announce(`${winner.name} wins by ${M.method}, turn ${M.turnNo}.`);
  if (o.querySelector("#res-review")) o.querySelector("#res-review").focus();
  if (winner.human && !M.hotseat) Sound.win();
  $("res-review").onclick = () => showFightLog(M.history, `${M.p[0].name} vs ${M.p[1].name}`);
  $("res-menu").onclick = () => { o.remove(); showMenu(); };
}

/* ================================================================ deck builder */

const DECKS_KEY = "motw-decks-v1";
function loadDecks() {
  try {
    const d = JSON.parse(localStorage.getItem(DECKS_KEY));
    if (Array.isArray(d)) return d;
  } catch (e) {}
  // migrate the old single-slot custom deck, if one exists
  try {
    const old = JSON.parse(localStorage.getItem("motw-custom-deck-v1"));
    if (Array.isArray(old)) {
      const migrated = [{ name: "My Custom Deck", cards: old }];
      saveDecks(migrated);
      return migrated;
    }
  } catch (e) {}
  return [];
}
function saveDecks(decks) {
  try { localStorage.setItem(DECKS_KEY, JSON.stringify(decks)); } catch (e) {}
}

function showBuilder() {
  app.innerHTML = "";
  let decks = loadDecks();
  let deck = decks.length ? decks[0].cards.slice() : PREBUILT.boxing.cards.slice();
  let deckName = decks.length ? decks[0].name : "";
  const s = el(`<div class="screen">
    <h2>Deck Builder</h2>
    <div id="saved-decks"></div>
    <div style="text-align:center;margin:12px 0">
      <input id="deck-name" maxlength="30" placeholder="Deck name, e.g. My Judo Gambit"
        style="width:100%;max-width:340px;padding:11px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--ink);font:inherit;text-align:center">
      <div style="margin-top:8px">
        <select id="start-from" style="padding:9px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--ink);font:inherit;max-width:280px">
          ${Object.entries(PREBUILT).map(([k, d]) => `<option value="${k}">${d.name}</option>`).join("")}
        </select>
        <button class="cnt-btn" style="width:auto;padding:0 14px" id="start-load">Start from this</button>
      </div>
    </div>
    <div id="builder-stats"></div>
    <div id="pool"></div>
    <div style="text-align:center;margin-top:16px">
      <button class="menu-btn" style="text-align:center;max-width:300px" id="save-deck">Save deck</button>
      <button class="back" id="bk">back without saving</button>
    </div>
  </div>`);
  app.appendChild(s);
  $("deck-name").value = deckName;

  function renderSavedDecks() {
    const box = $("saved-decks");
    if (!decks.length) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="art-head" style="color:var(--gold)">Your saved decks</div>`;
    decks.forEach((d, i) => {
      const st = deckStats(d.cards);
      const row = document.createElement("div");
      row.className = "pool-row";
      row.innerHTML = `<span class="pname">${d.name} <span class="ptext">· ${
        st.mastery ? "Mastery: " + ARTS[st.mastery].name : st.arts + " arts"} · hand ${st.handSize}</span></span>`;
      const load = document.createElement("button");
      load.className = "cnt-btn"; load.style.width = "auto"; load.style.padding = "0 12px";
      load.textContent = "Load";
      load.onclick = () => {
        deck = d.cards.slice();
        $("deck-name").value = d.name;
        refresh();
      };
      const del = document.createElement("button");
      del.className = "cnt-btn"; del.style.width = "auto"; del.style.padding = "0 12px";
      del.style.color = "var(--red)";
      del.textContent = "Delete";
      del.onclick = () => {
        if (!confirm(`Delete "${d.name}"? This cannot be undone.`)) return;
        decks.splice(i, 1);
        saveDecks(decks);
        renderSavedDecks();
      };
      row.appendChild(load); row.appendChild(del);
      box.appendChild(row);
    });
  }
  renderSavedDecks();
  $("start-load").onclick = () => {
    deck = PREBUILT[$("start-from").value].cards.slice();
    refresh();
  };

  const count = (id) => deck.filter((x) => x === id).length;

  function refresh() {
    const st = deckStats(deck);
    const sizeOk = deck.length === DECK_SIZE;
    $("builder-stats").innerHTML =
      `<span class="${sizeOk ? "ok" : "warn"}">${deck.length}/${DECK_SIZE} cards</span> · ` +
      `Purity <b>${Math.round(st.purity * 100)}%</b>${st.topArt ? " " + ARTS[st.topArt].name : ""} · ` +
      (st.mastery
        ? `<span class="ok">MASTERY: ${ARTS[st.mastery].passive}</span>`
        : `<span>no mastery (need 75% one art)</span>`) +
      ` · Hand size <b>${st.handSize}</b> (${st.arts} art${st.arts === 1 ? "" : "s"})`;
    // enforce: master cards only while their art has purity
    for (const c of CARDS) {
      if (c.master && count(c.id) > 0 && st.mastery !== c.art) {
        deck = deck.filter((x) => x !== c.id);
        return refresh();
      }
    }
    renderPool(st);
    $("save-deck").disabled = !sizeOk;
    $("save-deck").style.opacity = sizeOk ? 1 : .4;
  }

  function renderPool(st) {
    const pool = $("pool");
    pool.innerHTML = "";
    const order = ["boxing", "karate", "taekwondo", "muaythai", "judo", "bjj", "neutral"];
    for (const art of order) {
      const sec = document.createElement("div");
      sec.className = "art-section";
      sec.innerHTML = `<div class="art-head" style="color:${ARTS[art].color}">${ARTS[art].name}` +
        (ARTS[art].passive ? ` <span class="locknote">mastery: ${ARTS[art].passive}</span>` : "") + `</div>`;
      for (const c of CARDS.filter((x) => x.art === art)) {
        const n = count(c.id);
        const max = c.master ? MASTER_COPIES : MAX_COPIES;
        const masterLocked = c.master && st.mastery !== c.art;
        const row = document.createElement("div");
        row.className = "pool-row" + (masterLocked ? " locked" : "");
        row.innerHTML =
          `<span class="pcost">${c.cost}◈</span>
           <span class="pname">${c.name}${c.master ? " ✦" : ""} <span class="ptext">· ${c.ranges.map(cap).join("/")}${c.needTop ? " (top)" : ""} · ${c.text}</span>
           ${masterLocked ? '<span class="locknote">requires 75% ' + ARTS[c.art].name + "</span>" : ""}</span>`;
        const minus = document.createElement("button");
        minus.className = "cnt-btn"; minus.textContent = "-";
        minus.disabled = n === 0;
        minus.onclick = () => { deck.splice(deck.indexOf(c.id), 1); refresh(); };
        const num = document.createElement("span");
        num.className = "cnt"; num.textContent = n;
        const plus = document.createElement("button");
        plus.className = "cnt-btn"; plus.textContent = "+";
        plus.disabled = n >= max || deck.length >= DECK_SIZE || masterLocked;
        plus.onclick = () => { deck.push(c.id); refresh(); };
        row.appendChild(minus); row.appendChild(num); row.appendChild(plus);
        sec.appendChild(row);
      }
      pool.appendChild(sec);
    }
  }

  $("save-deck").onclick = () => {
    const name = $("deck-name").value.trim();
    if (!name) { $("deck-name").focus(); $("deck-name").placeholder = "Name your deck first"; return; }
    const existing = decks.findIndex((d) => d.name.toLowerCase() === name.toLowerCase());
    if (existing >= 0) {
      if (!confirm(`A deck named "${decks[existing].name}" exists. Overwrite it?`)) return;
      decks[existing] = { name, cards: deck.slice() };
    } else {
      decks.unshift({ name, cards: deck.slice() });
    }
    saveDecks(decks);
    showMenu();
  };
  $("bk").onclick = showMenu;
  refresh();
}

/* ================================================================ accessibility + gamepad */

function announce(text) {
  const n = $("a11y-live");
  if (!n) return;
  n.textContent = "";
  setTimeout(() => { n.textContent = text; }, 40);
}

function inHumanTurn() {
  return $("duel").style.display === "block" && M && !M.over &&
    M.p[M.active] && M.p[M.active].human && $("handwrap").style.visibility !== "hidden";
}

function currentFocusables() {
  const ovs = document.querySelectorAll(".overlay");
  if (ovs.length) {
    const ov = ovs[ovs.length - 1];
    return Array.from(ov.querySelectorAll('button, select, input, [tabindex]:not([tabindex="-1"])'));
  }
  if (inHumanTurn()) {
    const cards = Array.from($("hand").querySelectorAll("button.card.playable"));
    if (!$("endturn").disabled) cards.push($("endturn"));
    cards.push($("duelmenu"));
    return cards;
  }
  return Array.from(app.querySelectorAll('button, select, input, [tabindex]:not([tabindex="-1"])'));
}

function moveFocus(dir) {
  const list = currentFocusables();
  if (!list.length) return;
  let idx = list.indexOf(document.activeElement);
  idx = idx < 0 ? (dir > 0 ? 0 : list.length - 1) : (idx + dir + list.length) % list.length;
  list.forEach((x) => x.classList.remove("kbfocus"));
  list[idx].focus();
  list[idx].classList.add("kbfocus");
}

function isTyping() {
  const a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT");
}

function backOut() {
  const ov = document.querySelector(".overlay");
  if (ov) {
    const c = ov.querySelector("#pz-resume, #set-close, #lv-close, .back, #g-menu");
    if (c) c.click();
    return true;
  }
  if ($("duel").style.display === "block" && M && !M.over) { openPause(); return true; }
  return false;
}

document.addEventListener("keydown", (e) => {
  if (isTyping()) return;
  // number keys 1-9 play the matching hand card during your turn
  if (inHumanTurn() && /^[1-9]$/.test(e.key)) {
    const cards = Array.from($("hand").children);
    const c = cards[parseInt(e.key, 10) - 1];
    if (c && c.classList.contains("playable")) { e.preventDefault(); c.click(); }
    return;
  }
  if (e.key === "Escape") { if (backOut()) e.preventDefault(); return; }
  if (e.key === "Enter" && inHumanTurn() && document.activeElement === document.body) {
    if (!$("endturn").disabled) { e.preventDefault(); $("endturn").click(); }
    return;
  }
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); moveFocus(-1); }
  else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); moveFocus(1); }
});
document.addEventListener("mousedown", () => {
  document.querySelectorAll(".kbfocus").forEach((x) => x.classList.remove("kbfocus"));
});

// Gamepad: roving focus + activation, so the whole game is playable on a controller.
const Pad = (function () {
  let running = false;
  const prev = {};
  const down = (gp, i) => gp.buttons[i] && gp.buttons[i].pressed;
  function edge(id, i, gp) { const k = id + ":b" + i; const now = down(gp, i); const was = prev[k]; prev[k] = now; return now && !was; }
  function stickEdge(id, ax, val, dir) { const k = id + ":s" + ax + ":" + dir; const active = dir > 0 ? val > 0.6 : val < -0.6; const was = prev[k]; prev[k] = active; return active && !was; }
  function loop() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp) continue;
      const id = gp.index, ax0 = gp.axes[0] || 0, ax1 = gp.axes[1] || 0;
      if (edge(id, 12, gp) || edge(id, 14, gp) || stickEdge(id, 1, ax1, -1) || stickEdge(id, 0, ax0, -1)) moveFocus(-1);
      if (edge(id, 13, gp) || edge(id, 15, gp) || stickEdge(id, 1, ax1, 1) || stickEdge(id, 0, ax0, 1)) moveFocus(1);
      if (edge(id, 0, gp)) { const el = document.activeElement; if (el && el.click && el !== document.body) el.click(); }
      if (edge(id, 1, gp)) backOut();
      if (edge(id, 9, gp)) { if ($("duel").style.display === "block" && M && !M.over && !document.querySelector(".overlay")) openPause(); }
    }
    requestAnimationFrame(loop);
  }
  return { start() { if (!running) { running = true; loop(); } } };
})();

let SIM_RANGE = null;
function simAiTurn(f, foe, diff) {
  let safety = 40;
  while (!M.over && safety-- > 0) {
    const plays = aiRankPlays(f, foe);
    if (!plays.length) {
      if (aiShouldReset(f)) { resetStance(f); continue; }
      break;
    }
    const pick = aiSelect(plays, f, diff);
    if (!pick) break;
    playCard(f, pick.idx);
  }
}
function simMatch(cards0, cards1, diff) {
  HEADLESS = true;
  try {
    const p0 = newFighter("A", cards0, false, personaForDeck(cards0));
    const p1 = newFighter("B", cards1, false, personaForDeck(cards1));
    M = { p: [p0, p1], range: "far", top: null, active: 1, over: false, turnNo: 0, method: "K.O.", history: [], difficulty: diff, hotseat: false, gauntlet: false, abandoned: false, stall: 0, seats: null };
    while (!M.over && M.turnNo < 250) {
      M.active = 1 - M.active;
      M.turnNo += 1;
      const f = M.p[M.active], foe = M.p[1 - M.active];
      startOfTurn(f);
      if (SIM_RANGE) SIM_RANGE[M.range] = (SIM_RANGE[M.range] || 0) + 1;
      if (M.over) break;
      simAiTurn(f, foe, diff);
      if (M.over) break;
      M.p[M.active].st.clinch = 0;
      advanceStall(M.p[M.active]);
    }
    const timeout = p0.hp > 0 && p1.hp > 0;
    let winner;
    if (p0.hp <= 0 && p1.hp <= 0) winner = -1;
    else if (p0.hp <= 0) winner = 1;
    else if (p1.hp <= 0) winner = 0;
    else winner = p0.hp === p1.hp ? -1 : (p0.hp > p1.hp ? 0 : 1);
    return { winner, method: M.method, turns: M.turnNo, timeout };
  } finally {
    HEADLESS = false;
  }
}

const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const pct = (x) => (x * 100).toFixed(1) + "%";

async function runMatrix(N, diff, statusEl, outEl) {
  const decks = simDecks();
  const n = decks.length;
  const grid = decks.map(() => decks.map(() => null));
  const wins = decks.map(() => 0), games = decks.map(() => 0);
  let tap = 0, ko = 0, timeout = 0, turns = 0, total = 0, pmGames = 0, pmPureWins = 0;
  SIM_RANGE = { far: 0, close: 0, ground: 0 };
  outEl.innerHTML = "";
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i === j) { grid[i][j] = null; continue; }
      let iw = 0;
      for (let g = 0; g < N; g++) {
        const swap = g % 2 === 1;   // alternate first mover to cancel initiative
        const r = swap ? simMatch(decks[j].cards, decks[i].cards, diff)
                       : simMatch(decks[i].cards, decks[j].cards, diff);
        let winnerDeck;
        if (r.winner === -1) winnerDeck = -1;
        else if (!swap) winnerDeck = r.winner === 0 ? i : j;
        else winnerDeck = r.winner === 0 ? j : i;
        if (winnerDeck === i) iw++;
        if (r.timeout) timeout++; else if (r.method === "Tap Out") tap++; else ko++;
        turns += r.turns; total++;
        if (decks[i].tag !== decks[j].tag) {
          pmGames++;
          const pureIdx = decks[i].tag === "pure" ? i : j;
          if (winnerDeck === pureIdx) pmPureWins++;
        }
      }
      wins[i] += iw; games[i] += N; grid[i][j] = iw / N;
      statusEl.textContent = `Simulating ${decks[i].name} vs ${decks[j].name} ...`;
      await sleep(0);
    }
  }
  statusEl.textContent = `Done. ${total.toLocaleString()} games at ${cap(diff)}.`;

  const wr = decks.map((d, i) => ({ name: d.name, tag: d.tag, wr: games[i] ? wins[i] / games[i] : 0 }));
  const pureWR = avg(wr.filter((x) => x.tag === "pure").map((x) => x.wr));
  const mixWR = avg(wr.filter((x) => x.tag === "mixed").map((x) => x.wr));
  const pmWR = pmGames ? pmPureWins / pmGames : 0;
  const rt = SIM_RANGE.far + SIM_RANGE.close + SIM_RANGE.ground || 1;
  const off = (x) => Math.abs(x - 0.5) > 0.05;

  // matchup grid
  let gt = `<div class="simcard"><b>Matchup grid</b>: row's win rate vs column (green 45% or less, red 55% or more).<table class="simtable"><tr><th>vs</th>${decks.map((d) => `<th>${d.name.split(" ")[0]}</th>`).join("")}</tr>`;
  for (let i = 0; i < n; i++) {
    gt += `<tr><th>${decks[i].name}</th>`;
    for (let j = 0; j < n; j++) {
      if (i === j) { gt += `<td>-</td>`; continue; }
      const v = grid[i][j];
      const cls = v >= 0.55 ? "hot" : (v <= 0.45 ? "cold" : "");
      gt += `<td class="${cls}">${Math.round(v * 100)}</td>`;
    }
    gt += `</tr>`;
  }
  gt += `</table></div>`;

  // per-deck overall win rate
  let wt = `<div class="simcard"><b>Overall win rate</b> (target 45-55%). Flags marked.<table class="simtable"><tr><th>Deck</th><th>Type</th><th>Win rate</th></tr>`;
  wr.slice().sort((a, b) => b.wr - a.wr).forEach((x) => {
    wt += `<tr><td>${x.name}</td><td>${x.tag}</td><td class="${x.wr >= 0.55 ? "hot" : (x.wr <= 0.45 ? "cold" : "")}">${pct(x.wr)}${off(x.wr) ? " ⚑" : ""}</td></tr>`;
  });
  wt += `</table></div>`;

  // summary
  const st = `<div class="simcard">
    <b>Purity vs cross-training</b> (the core balance goal):<br>
    Pure decks average <b>${pct(pureWR)}</b> · Mixed decks average <b>${pct(mixWR)}</b> ·
    Pure-vs-mixed head-to-head: pure wins <b class="${Math.abs(pmWR - 0.5) > 0.05 ? "flag" : "good"}">${pct(pmWR)}</b>
    ${Math.abs(pmWR - 0.5) <= 0.05 ? ", within the 5-point target" : ", outside the 5-point target"}.
    <hr style="border-color:var(--border)">
    <b>Finish method</b>: KO ${pct(ko / total)} · Tap Out ${pct(tap / total)} · Decision/timeout ${pct(timeout / total)}<br>
    <b>Average duel length</b>: ${(turns / total).toFixed(1)} turns<br>
    <b>Range-time share</b>: Far ${pct(SIM_RANGE.far / rt)} · Close ${pct(SIM_RANGE.close / rt)} · Ground ${pct(SIM_RANGE.ground / rt)}
  </div>`;

  outEl.innerHTML = st + wt + gt;
}

  const t = M.taught || (M.taught = {});
  const me = M.p[0], foe = M.p[1];
  const once = (id) => { if (t[id]) return false; t[id] = true; return true; };
  if (M.range === "ground" && once("ground")) return coach("The fight is on the ground. That's BJJ's home, and Rosa's. Whoever holds top position controls it.");
  if (M.range === "ground" && M.top === 1 && once("bottom")) return coach("Rosa has top position: the danger zone. Escape with Technical Stand-up to get back to your feet, or a Sweep to reverse the position.");
  if (M.range === "ground" && M.top === 0 && once("top")) return coach("You have top position. Play Pass Guard to gain Control, then a submission like Juji-gatame can end it outright.");
  if (foe.hp <= 8 && foe.hp > 0 && once("tap")) return coach("Rosa is low enough to tap. A submission that leaves her at or below its threshold finishes instantly. You don't have to reach 0 HP.");
  if (me.hp <= 8 && me.hp > 0 && once("lowhp")) return coach("You're hurt. Guard cards absorb the next hits, Create Space resets the range, and Breathe buys back stamina.");
  if (M.active === 0 && once("turn1")) return coach("Your turn. Greyed-out cards can't be played at the current range. Change range to enable them. Spend up to 3 stamina, then End Turn.");
